<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
  </defs>
  <!-- Terminal window background -->
  <rect x="4" y="8" width="56" height="48" rx="6" fill="#0f1628"/>
  <!-- Terminal top bar -->
  <rect x="4" y="8" width="56" height="12" rx="6" ry="6" fill="#1e2844"/>
  <rect x="4" y="14" width="56" height="6" fill="#1e2844"/>
  <!-- Traffic lights -->
  <circle cx="14" cy="14" r="3" fill="#ef4444"/>
  <circle cx="24" cy="14" r="3" fill="#fbbf24"/>
  <circle cx="34" cy="14" r="3" fill="#10b981"/>
  <!-- AWS text styled -->
  <text x="32" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="url(#grad)" text-anchor="middle">AWS</text>
  <!-- Cursor blink -->
  <rect x="46" y="34" width="2" height="12" fill="#f59e0b" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
