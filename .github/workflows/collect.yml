name: Collect AWS What's New

on:
  schedule:
    # 毎日10:00 JST（01:00 UTC）に実行
    - cron: '0 1 * * *'
  workflow_dispatch:

# schedule と workflow_dispatch の同時実行を防ぐ（進行中の実行はキャンセルしない）
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # セキュリティ: 認証情報の露出を防止

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Run collector
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DUPLICATE_CHECK_DAYS: '7'
          NODE_ENV: production
          TZ: Asia/Tokyo
        run: npm run collect

      # 品質ゲート: 生成された Markdown を main に入れる前に検証する。
      # 自動マージ（下の gh pr merge）は ci.yml を待たないため、ここで同等の
      # チェックを実行しないと壊れた生成物が品質検証なしで main に入ってしまう。
      # vitest の実データ smoke テストが全日次 Markdown のパース可能性を、
      # docs:build が VitePress ビルドの成立を検証する。失敗時はジョブが
      # ここで停止し、main には何も入らない（翌日の実行で再試行される）。
      - name: Quality gate (validate generated content)
        run: |
          npm run typecheck
          npx vitest run
          npm run docs:build

      - name: Check for changes
        id: check_changes
        run: |
          git add docs/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch and commit
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Tokyo
        run: |
          BRANCH_NAME="auto-update/$(date +'%Y-%m-%d-%H%M%S')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git commit -m "feat: add AWS What's New update for $(date +'%Y-%m-%d')"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Tokyo
        run: |
          PR_URL=$(gh pr create \
            --title "Auto: AWS What's New $(date +'%Y-%m-%d')" \
            --body "Automated daily AWS What's New digest update." \
            --base main \
            --head "${{ steps.create_branch.outputs.branch_name }}")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Merge Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.create_pr.outputs.pr_url }}" --squash --delete-branch

      # repository_dispatch はこのジョブから deploy.yml を起動する唯一の経路。
      # GITHUB_TOKEN で行った push（上の squash merge）は push トリガの
      # ワークフローを起動しない（GitHub の再帰実行防止）ため、deploy.yml の
      # push トリガには乗らず、二重デプロイにはならない。push トリガは
      # 人間が docs/** を直接変更したときの補完として機能する。
      - name: Trigger Deploy Workflow
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -X POST \
            -f event_type=deploy-site
