name: CI

on:
  pull_request:
  push:
    branches: [main]

# デフォルトは読み取りのみ。書き込みが必要なジョブで個別に昇格する（最小権限）
permissions:
  contents: read

# 同一ブランチの古い実行はキャンセルしてランナーを節約
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 全PR共通の品質ゲート。依存バンプがビルド・テスト・型・lintを壊さないか検証する。
  # auto-merge はこのジョブの成功を前提（needs）にしているため、ここが赤ければ自動マージは走らない。
  quality:
    name: Quality (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # カバレッジ付きで実行し、vitest.config.ts の閾値（後退防止ライン）を守らせる
      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build docs (VitePress)
        run: npm run docs:build

  # Dependabot の PR を、上の CI ジョブがすべて通ったあとに条件付きでマージする。
  # needs で CI の成功を前提にしているので、ブランチ保護（無料プランの private repo では使えない）に頼らない。
  # ブランチ保護を使わないので、毎日の collect.yml の自動マージにも影響しない。
  # 自動マージする条件:
  #   - patch: version update / security update のどちらも
  #   - minor: version update のグループ（minor-and-patch）だけ
  # major と、minor を含む security update は人がレビューする。
  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      actions: write # deploy.yml を workflow_dispatch で起動するため
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Squash-merge eligible updates
        id: merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.dependency-group == 'minor-and-patch' &&
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN によるマージでは push トリガーの workflow が起動しないため、
      # 依存パッケージを更新したときはデプロイを明示的に起動する
      - name: Trigger deploy
        if: steps.merge.outcome == 'success' && steps.metadata.outputs.package-ecosystem == 'npm_and_yarn'
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
